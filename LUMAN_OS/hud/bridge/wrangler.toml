workers_dev = true

[vars]
REQUIRE_CF_ACCESS = "true"
PRIVATE_REPO = "edwardmoralesjr-cmd/LUMAN-GPT-Command-Center"
PRIVATE_OPEN_LOOPS_PATH = "LUMAN_PRIVATE_VAULT/STATE/OPEN_LOOPS.md"

# Configure these outside source control:
