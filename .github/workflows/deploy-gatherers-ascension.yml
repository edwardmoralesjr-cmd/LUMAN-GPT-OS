# GitHub Pages deployment for the existing Gatherer's Ascension game plus the public-safe LUMAN HUD.
name: Deploy LUMAN Pages Apps

on:
  push:
    branches:
      - main
    paths:
      - "LUMAN_OS/game_lab/gatherers_ascension/app/**"
      - "LUMAN_OS/hud/app/**"
      - ".github/workflows/deploy-gatherers-ascension.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_DIRECTORY: LUMAN_OS/game_lab/gatherers_ascension/app
  HUD_DIRECTORY: LUMAN_OS/hud/app

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npm install

      - name: Build production game
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npm run build

      - name: Add LUMAN HUD at /luman-hud/
        run: |
          mkdir -p "${APP_DIRECTORY}/dist/luman-hud"
          cp "${HUD_DIRECTORY}/index.html" "${APP_DIRECTORY}/dist/luman-hud/index.html"
          cp "${HUD_DIRECTORY}/styles.css" "${APP_DIRECTORY}/dist/luman-hud/styles.css"
          cp "${HUD_DIRECTORY}/app.js" "${APP_DIRECTORY}/dist/luman-hud/app.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIRECTORY }}/dist

  deploy:
    name: Publish Pages apps
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
