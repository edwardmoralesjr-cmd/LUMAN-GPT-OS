name: Check LUMAN HUD Bridge

on:
  pull_request:
    paths:
      - "LUMAN_OS/hud/**"
      - ".github/workflows/luman-hud-bridge-check.yml"
      - ".github/workflows/luman-bridge-bootstrap.yml"
      - ".github/workflows/luman-bridge-activate.yml"
  push:
    branches:
      - main
    paths:
      - "LUMAN_OS/hud/**"
      - ".github/workflows/luman-hud-bridge-check.yml"
      - ".github/workflows/luman-bridge-bootstrap.yml"
      - ".github/workflows/luman-bridge-activate.yml"

permissions:
  contents: read

jobs:
  syntax-and-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check LUMAN_OS/hud/bridge/src/index.js

      - name: Check HUD JavaScript syntax
        run: node --check LUMAN_OS/hud/app/app.js

      - name: Verify bridge is read-only in V1
        shell: bash
        run: |
          if grep -E "request\.method[[:space:]]*===?[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]" LUMAN_OS/hud/bridge/src/index.js; then
            echo "Unexpected write-method route found in V1 bridge"
            exit 1
          fi
          grep -q "read_only_bridge" LUMAN_OS/hud/bridge/src/index.js
          grep -q "Cache-Control.*no-store" LUMAN_OS/hud/bridge/src/index.js

      - name: Verify public HUD does not contain committed secrets
        shell: bash
        run: |
          if grep -R -E "(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|-----BEGIN .*PRIVATE KEY-----)" LUMAN_OS/hud --exclude='SECURITY_CONTRACT.md'; then
            echo "Possible secret material found in HUD tree"
            exit 1
          fi

      - name: Verify bootstrap cannot receive private-source credentials
        shell: bash
        run: |
          file=.github/workflows/luman-bridge-bootstrap.yml
          if grep -E "GITHUB_PRIVATE_TOKEN|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_REFRESH_TOKEN" "$file"; then
            echo "Bootstrap workflow must not reference private-source credentials"
            exit 1
          fi
          grep -q "workflow_dispatch" "$file"
          grep -q "confirm_bootstrap" "$file"

      - name: Verify activation has explicit safety gates
        shell: bash
        run: |
          file=.github/workflows/luman-bridge-activate.yml
          grep -q "workflow_dispatch" "$file"
          grep -q "confirm_access_enabled" "$file"
          grep -q "confirm_google_readonly" "$file"
          grep -q "GITHUB_PRIVATE_TOKEN" "$file"
          grep -q "GOOGLE_REFRESH_TOKEN" "$file"
          grep -q "luman-bridge-production" "$file"

      - name: Verify deployment workflows do not auto-run on push
        shell: bash
        run: |
          for file in .github/workflows/luman-bridge-bootstrap.yml .github/workflows/luman-bridge-activate.yml; do
            if grep -Eq "^[[:space:]]*push:" "$file"; then
              echo "$file must remain manual-only"
              exit 1
            fi
          done
