name: Bootstrap LUMAN Bridge

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: Deploy the bridge shell without private-source credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ inputs.confirm_bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: luman-bridge-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify bootstrap configuration exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUD_ORIGIN: ${{ secrets.HUD_ORIGIN }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
        run: |
          missing=0
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            HUD_ORIGIN
            ALLOWED_EMAIL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing protected configuration::$key is not configured in the luman-bridge-production environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate bridge JavaScript
        run: node --check LUMAN_OS/hud/bridge/src/index.js

      - name: Deploy bridge shell without private-source credentials
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: LUMAN_OS/hud/bridge
          wranglerVersion: "4"
          command: deploy
          secrets: |
            HUD_ORIGIN
            ALLOWED_EMAIL
          postCommands: wrangler deployments status
        env:
          HUD_ORIGIN: ${{ secrets.HUD_ORIGIN }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}

      - name: Record safe bootstrap handoff
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## LUMAN Bridge bootstrap complete"
            echo
            echo "The Worker shell was deployed without private GitHub or Google source credentials."
            echo
            if [ -n "${DEPLOYMENT_URL:-}" ]; then
              echo "Worker URL: ${DEPLOYMENT_URL}"
              echo
            fi
            echo "Next: enable Cloudflare Access for the Worker URL and restrict the Access policy to the intended identity."
            echo "Do not run the activation workflow until Access is enabled."
          } >> "$GITHUB_STEP_SUMMARY"
